name: Device tests

# Decided: these run on an emulator only when started by hand ("Run workflow"
# on the Actions tab), for example before a release or after changing the
# Android adapters. Emulators are slow, so pull requests stay quick; they still
# compile the app's device tests.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  device-tests:
    name: Device tests on Android ${{ matrix.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest supported version, where the cryptography must be proved.
          - android: "8.0"
            api-level: 26
            target: default
          # A recent version.
          - android: "16"
            api-level: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the tests before the emulator starts
        run: |
          ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          # The core's device test task, shown on the run in case its name changes.
          ./gradlew -q :core:tasks --all | grep -i connected | sed 's/^/::notice title=Core device test tasks::/' || true
      - name: Run the core's tests and the app's device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          # connectedCheck does not include the core's device tests, so they are named too.
          # The runner uses sh for each line, which would hide a Gradle failure behind tee.
          script: bash -c 'set -o pipefail; ./gradlew connectedCheck :core:connectedAndroidDeviceTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"'
      - name: Count the tests that ran
        if: always()
        run: python3 .github/scripts/count-device-tests.py "${{ matrix.android }}"
      - name: Show the cause on the run
        if: failure()
        run: .github/scripts/report-gradle-failure.sh
      - name: Attach the test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports-android-${{ matrix.android }}
          path: |
            core/build/reports/
            androidApp/build/reports/
          if-no-files-found: ignore
