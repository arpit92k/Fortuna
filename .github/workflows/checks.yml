name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Run the core tests on the JVM
        run: ./gradlew :core:jvmTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Show the cause on the pull request
        if: failure()
        run: .github/scripts/report-gradle-failure.sh

  linux-target:
    name: Linux target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile the core for Linux
        run: ./gradlew :core:compileKotlinLinuxX64 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Show the cause on the pull request
        if: failure()
        run: .github/scripts/report-gradle-failure.sh

  debug-app:
    name: Debug app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Use the fixed debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # The Android build signs debug apps with ~/.android/debug.keystore.
          # Putting the same key there on every run lets each build install
          # over the previous one without losing the app's data.
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "::warning title=Throwaway signing key::The DEBUG_KEYSTORE_BASE64 secret is not set, so this build is signed with a new key and will not install over an earlier build."
          fi
      - name: Build the debug app and check its manifest
        run: ./gradlew :androidApp:assembleDebug :androidApp:verifyDebugNoInternetPermission 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Attach the debug app
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          archive: false
          if-no-files-found: error
      - name: Show the cause on the pull request
        if: failure()
        run: .github/scripts/report-gradle-failure.sh
